<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>页面不在这里 · Flash Words</title>
    <style>
      :root { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; color: #11110f; background: #f4f0e5; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(680px, 100%); border: 1px solid #11110f; background: #faf8f1; box-shadow: 8px 8px 0 #11110f; }
      .frame { min-height: 360px; display: grid; place-items: center; overflow: hidden; background: #11110f; color: #f4f0e5; }
      strong { font-size: clamp(120px, 32vw, 280px); line-height: .7; letter-spacing: -.08em; transform: rotate(-5deg); }
      section { padding: 24px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
      h1 { margin: 0 0 6px; font-size: 22px; }
      p { margin: 0; color: #68675f; font-size: 13px; }
      a { min-height: 44px; padding: 0 18px; display: inline-flex; align-items: center; flex: 0 0 auto; border-radius: 8px; background: #b9ef00; color: #11110f; font-weight: 800; text-decoration: none; box-shadow: 3px 3px 0 #11110f; }
      a:focus-visible { outline: 3px solid #b9ef00; outline-offset: 3px; }
      @media (max-width: 520px) { section { align-items: flex-start; flex-direction: column; } }
    </style>
  </head>
  <body>
    <main>
      <div class="frame"><strong>404</strong></div>
      <section>
        <div><h1>这个画面没有被编排</h1><p>返回编辑器，继续让文字动起来。</p></div>
        <a href="./">返回编辑器</a>
      </section>
    </main>
  </body>
</html>
