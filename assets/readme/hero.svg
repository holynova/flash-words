<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">动态文字生成器 Flash Words — 浏览器本地动态文字编排与导出</title>
  <desc id="desc">暖纸底编辑风标题：动态文字生成器；右侧是一个大号“艺”字做故障切片动效，下方是进入/持续/强调/退出/背景五槽组合配方。</desc>

  <rect width="1200" height="360" rx="26" fill="#f4f1ea"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#3f5a0c">KINETIC TYPOGRAPHY · REACT + TYPESCRIPT</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#1c1a17">动态文字生成器</text>
    <text x="56" y="168" font-size="23" fill="#1c1a17">FLASH WORDS — 浏览器里的动态文字实验室</text>
    <text x="56" y="204" font-size="19" fill="#5a564e">写字、选模板、调配方，本地导出 MP4、WebM 或 GIF。</text>
    <g id="chips" font-size="18" fill="#1c1a17" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.5"/><text x="119" y="262">14 个模板</text></g>
      <g><rect x="194" y="238" width="108" height="36" rx="18" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.5"/><text x="248" y="262">5 槽配方</text></g>
      <g><rect x="314" y="238" width="176" height="36" rx="18" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.5"/><text x="402" y="262">MP4 / WebM / GIF</text></g>
      <g><rect x="502" y="238" width="150" height="36" rx="18" fill="#ffffff" stroke="#d8d2c4" stroke-width="1.5"/><text x="577" y="262">全本地 · 零上传</text></g>
    </g>
  </g>

  <g id="poster" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <!-- labels first: they sit on the paper background -->
    <g id="labels" text-anchor="middle">
      <text x="942" y="258" font-size="18" fill="#5a564e">组合配方 · 五槽</text>
      <text x="942" y="344" font-size="18" fill="#5a564e">IN · MOVE · HIT · OUT · BG</text>
    </g>
    <!-- kinetic character with ghost copies + glitch slices -->
    <text x="918" y="196" font-size="170" font-weight="900" fill="none" stroke="#1c1a17" stroke-width="2" opacity="0.25" text-anchor="middle">艺</text>
    <text x="958" y="196" font-size="170" font-weight="900" fill="none" stroke="#1c1a17" stroke-width="2" opacity="0.25" text-anchor="middle">艺</text>
    <text x="938" y="196" font-size="170" font-weight="900" fill="#1c1a17" text-anchor="middle">艺</text>
    <rect x="830" y="96" width="150" height="12" fill="#b5e33a"/>
    <rect x="900" y="140" width="170" height="12" fill="#1c1a17"/>
    <rect x="850" y="184" width="130" height="12" fill="#b5e33a"/>
    <!-- recipe slots -->
    <g id="slots" font-size="18" fill="#f4f1ea" text-anchor="middle">
      <g><rect x="740" y="272" width="76" height="46" rx="8" fill="#1c1a17"/><text x="778" y="301">进入</text></g>
      <g><rect x="822" y="272" width="76" height="46" rx="8" fill="#1c1a17"/><text x="860" y="301">持续</text></g>
      <g><rect x="904" y="272" width="76" height="46" rx="8" fill="#1c1a17"/><text x="942" y="301">强调</text></g>
      <g><rect x="986" y="272" width="76" height="46" rx="8" fill="#1c1a17"/><text x="1024" y="301">退出</text></g>
      <g><rect x="1068" y="272" width="76" height="46" rx="8" fill="#1c1a17"/><text x="1106" y="301">背景</text></g>
    </g>
  </g>
</svg>
